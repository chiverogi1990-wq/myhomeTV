plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.home.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.home.tvlauncher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем отладочным ключом, чтобы APK сразу ставился на приставку
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Внешних библиотек нет: только стандартный Android
dependencies {
}
